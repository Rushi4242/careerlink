<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Review Jobs | Admin</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

  <div class="wrapper">
    <!-- Dynamic Sidebar -->
    <nav class="sidebar" id="sidebarNav"></nav>

    <!-- Main Content Area -->
    <div class="content">
      <!-- Top Navbar -->
      <div class="top-navbar">
        <div class="d-flex align-items-center gap-3">
          <button class="mobile-nav-toggle" id="mobileNavToggle"><i class="bi bi-list"></i></button>
          <h5 class="m-0 fw-bold text-dark"><i class="bi bi-briefcase-fill text-success me-2"></i>Review Pending Jobs</h5>
        </div>
        <div class="fw-semibold text-muted small">
          <i class="bi bi-shield-check text-success me-1"></i><span class="display-user-name">Admin</span>
        </div>
      </div>

      <!-- Data Card -->
      <div class="data-card">
        <div id="alertBox" style="display: none;" class="alert p-3 rounded-3 mb-3"></div>

        <div class="table-responsive">
          <table class="table table-hover align-middle border">
            <thead>
              <tr>
                <th>Job Title</th>
                <th>Company</th>
                <th>Location / Experience</th>
                <th>Posted By (HR)</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="pendingJobsTableBody">
              <!-- Dynamically populated -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app-data.js"></script>
  <script src="js/sidebar.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const user = CareerLinkDB.requireAuth('Admin');
      if (!user) return;

      function renderPendingJobs() {
        const pendingJobs = CareerLinkDB.getPendingJobs();
        const tbody = document.getElementById('pendingJobsTableBody');

        if (pendingJobs.length === 0) {
          tbody.innerHTML = `
            <tr>
              <td colspan="5" class="text-center text-muted py-5">
                <i class="bi bi-check-circle fs-1 d-block mb-2 text-success opacity-75"></i>
                <h6 class="fw-bold text-dark">No pending jobs to review!</h6>
                <p class="small mb-0">All submitted jobs are currently evaluated and published.</p>
              </td>
            </tr>
          `;
          return;
        }

        tbody.innerHTML = pendingJobs.map(job => {
          return `
            <tr>
              <td>
                <b class="text-primary d-block">${job.job_title}</b>
                <small class="text-muted">Salary: <span class="text-success fw-bold">${job.salary}</span></small>
              </td>
              <td><i class="bi bi-building me-1 text-muted"></i>${job.company_name}</td>
              <td>
                ${job.location}<br>
                <small class="text-muted">Exp: ${job.experience}</small>
              </td>
              <td>
                <span class="badge bg-light text-dark border px-3 py-2">
                  <i class="bi bi-person me-1"></i>${job.hr_name}
                </span>
              </td>
              <td>
                <div class="d-flex gap-2">
                  <button onclick="handleStatus(${job.job_id}, 'Approved')" class="btn btn-sm btn-success rounded-pill px-3 fw-bold">
                    <i class="bi bi-check-lg me-1"></i>Approve
                  </button>
                  <button onclick="handleStatus(${job.job_id}, 'Rejected')" class="btn btn-sm btn-outline-danger rounded-pill px-3 fw-bold">
                    <i class="bi bi-x-lg me-1"></i>Reject
                  </button>
                </div>
              </td>
            </tr>
          `;
        }).join('');
      }

      window.handleStatus = function(jobId, status) {
        const res = CareerLinkDB.setJobApprovalStatus(jobId, status);
        const alertBox = document.getElementById('alertBox');
        if (res.success) {
          alertBox.className = `alert ${status === 'Approved' ? 'alert-success' : 'alert-warning'} p-3 rounded-3 mb-3 fw-bold`;
          alertBox.innerHTML = `<i class="bi bi-check-circle-fill me-2"></i>${res.message}`;
          alertBox.style.display = 'block';
          renderPendingJobs();
        }
      };

      renderPendingJobs();
    });
  </script>
</body>
</html>
