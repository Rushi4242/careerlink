<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forgot Password | Career Link</title>
  <meta name="description" content="Reset your Career Link password securely.">
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="auth-page">

  <div class="container py-4">
    <div class="login-card">
      <!-- Left Brand Panel -->
      <div class="brand-side d-none d-md-flex">
        <h1 class="fw-bold mb-3"><i class="bi bi-shield-lock-fill me-2"></i>Account Recovery</h1>
        <p class="fs-5 opacity-90">Verify your identity to securely reset your Career Link account password.</p>
        <div class="mt-4 pt-4 border-top border-white border-opacity-25">
          <small class="opacity-75 d-block"><i class="bi bi-shield-check me-2"></i>Double factor identity check with registered mobile & email.</small>
        </div>
      </div>

      <!-- Right Form Panel -->
      <div class="form-side">
        <h3 class="fw-bold text-dark mb-4">Reset Password</h3>

        <!-- Alert Banner -->
        <div id="alertBox" style="display: none;" class="alert p-3 rounded-3 mb-3"></div>

        <form id="forgotForm">
          <div class="mb-3">
            <label class="form-label text-muted fw-bold small">Registered Email Address</label>
            <input type="email" id="resetEmail" name="email" class="form-control" placeholder="name@example.com" required>
          </div>

          <div class="mb-4">
            <label class="form-label text-muted fw-bold small">Registered Mobile Number</label>
            <input type="tel" id="resetMobile" name="mobile" class="form-control" placeholder="10-digit number" maxlength="10" required>
          </div>

          <hr class="mb-4 opacity-25">

          <div class="mb-3">
            <label class="form-label text-muted fw-bold small">New Password</label>
            <input type="password" id="newPass" name="new_password" class="form-control" placeholder="Enter new password" required>
          </div>

          <div class="mb-4">
            <label class="form-label text-muted fw-bold small">Confirm New Password</label>
            <input type="password" id="confirmPass" name="confirm_password" class="form-control" placeholder="Re-enter new password" required>
          </div>

          <button type="submit" id="submitBtn" class="btn btn-primary w-100 py-2 fw-bold rounded-pill mb-3">Reset Password</button>
        </form>

        <div id="successNav" style="display: none;" class="mt-3">
          <a href="login.html" class="btn btn-success w-100 py-2 fw-bold rounded-pill mb-3">Return to Sign In</a>
        </div>

        <div class="text-center mt-3 border-top pt-3">
          <a href="login.html" class="text-decoration-none fw-bold text-muted small"><i class="bi bi-arrow-left me-1"></i>Back to Login</a>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app-data.js"></script>
  <script>
    document.getElementById('forgotForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alertBox = document.getElementById('alertBox');
      const submitBtn = document.getElementById('submitBtn');

      const email = document.getElementById('resetEmail').value;
      const mobile = document.getElementById('resetMobile').value;
      const newPass = document.getElementById('newPass').value;
      const confirmPass = document.getElementById('confirmPass').value;

      if (newPass !== confirmPass) {
        alertBox.className = 'alert alert-danger p-3 rounded-3 mb-3';
        alertBox.innerHTML = `<i class="bi bi-exclamation-circle-fill me-2"></i>New Password and Confirm Password do not match!`;
        alertBox.style.display = 'block';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span>Updating...`;

      const result = await CareerLinkDB.resetPassword(email, mobile, newPass);

      submitBtn.disabled = false;
      submitBtn.innerHTML = `Reset Password`;

      if (result.success) {
        alertBox.className = 'alert alert-success p-3 rounded-3 mb-3 text-center fw-semibold';
        alertBox.innerHTML = `<i class="bi bi-check-circle-fill me-2"></i>${result.message}`;
        alertBox.style.display = 'block';
        document.getElementById('forgotForm').style.display = 'none';
        document.getElementById('successNav').style.display = 'block';
      } else {
        alertBox.className = 'alert alert-danger p-3 rounded-3 mb-3 fw-semibold';
        alertBox.innerHTML = `<i class="bi bi-exclamation-circle-fill me-2"></i>${result.message}`;
        alertBox.style.display = 'block';
      }
    });
  </script>
</body>
</html>
