<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manage Users | Admin Portal</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

  <div class="wrapper">
    <!-- Dynamic Sidebar -->
    <nav class="sidebar" id="sidebarNav"></nav>

    <!-- Main Content Area -->
    <div class="content">
      <!-- Top Navbar -->
      <div class="top-navbar">
        <div class="d-flex align-items-center gap-3">
          <button class="mobile-nav-toggle" id="mobileNavToggle"><i class="bi bi-list"></i></button>
          <h5 class="m-0 fw-bold text-dark"><i class="bi bi-people-fill text-primary me-2"></i>User Management</h5>
        </div>
        <div class="fw-semibold text-muted small">
          <i class="bi bi-shield-check text-success me-1"></i><span class="display-user-name">Admin</span>
        </div>
      </div>

      <!-- Users Table Card -->
      <div class="table-card">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <h5 class="fw-bold text-primary mb-0">All Registered Users</h5>
          <span class="badge bg-light text-dark border px-3 py-2" id="userCountBadge">0 Users Total</span>
        </div>

        <div id="alertBox" style="display: none;" class="alert p-3 rounded-3 mb-3"></div>

        <div class="table-responsive">
          <table class="table table-hover align-middle border">
            <thead class="table-light">
              <tr>
                <th>ID</th>
                <th>Full Name</th>
                <th>Email Address</th>
                <th>Mobile</th>
                <th>Role</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="usersTableBody">
              <!-- Dynamically populated -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app-data.js"></script>
  <script src="js/sidebar.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const user = CareerLinkDB.requireAuth('Admin');
      if (!user) return;

      function renderUsersTable() {
        const users = CareerLinkDB.getNonAdminUsers();
        const tbody = document.getElementById('usersTableBody');
        document.getElementById('userCountBadge').textContent = `${users.length} Users Total`;

        if (users.length === 0) {
          tbody.innerHTML = `
            <tr>
              <td colspan="6" class="text-center text-muted py-4">No registered users found.</td>
            </tr>
          `;
          return;
        }

        tbody.innerHTML = users.map(u => {
          let roleBadge = '';
          if (u.role === 'HR') {
            roleBadge = '<span class="badge px-3 py-2 rounded-pill" style="background:#e0d4f5; color:#6f42c1;"><i class="bi bi-buildings-fill me-1"></i>Employer/HR</span>';
          } else {
            roleBadge = '<span class="badge px-3 py-2 rounded-pill" style="background:#d1f4fa; color:#0284c7;"><i class="bi bi-person-fill me-1"></i>Candidate</span>';
          }

          return `
            <tr>
              <td class="text-muted fw-bold">#${u.user_id}</td>
              <td class="fw-semibold text-dark">${u.full_name}</td>
              <td>${u.email}</td>
              <td><i class="bi bi-phone me-1 text-muted"></i>${u.mobile || 'N/A'}</td>
              <td>${roleBadge}</td>
              <td>
                <button onclick="handleDeleteUser(${u.user_id}, '${u.full_name}')" class="btn btn-sm btn-outline-danger rounded-pill px-3 fw-bold">
                  <i class="bi bi-trash-fill me-1"></i>Remove
                </button>
              </td>
            </tr>
          `;
        }).join('');
      }

      window.handleDeleteUser = function(userId, userName) {
        if (confirm(`Are you sure you want to permanently remove "${userName}" and all associated jobs, applications, and interviews?`)) {
          const res = CareerLinkDB.deleteUser(userId);
          const alertBox = document.getElementById('alertBox');
          if (res.success) {
            alertBox.className = 'alert alert-success p-3 rounded-3 mb-3 fw-bold';
            alertBox.innerHTML = `<i class="bi bi-check-circle-fill me-2"></i>${res.message}`;
            alertBox.style.display = 'block';
            renderUsersTable();
          }
        }
      };

      renderUsersTable();
    });
  </script>
</body>
</html>
