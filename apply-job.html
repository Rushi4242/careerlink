<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Application Status | Candidate</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

  <div class="wrapper">
    <!-- Dynamic Sidebar -->
    <nav class="sidebar" id="sidebarNav"></nav>

    <!-- Main Content Area -->
    <div class="content">
      <!-- Top Navbar -->
      <div class="top-navbar">
        <div class="d-flex align-items-center gap-3">
          <button class="mobile-nav-toggle" id="mobileNavToggle"><i class="bi bi-list"></i></button>
          <h5 class="m-0 fw-bold text-dark">Application Status</h5>
        </div>
        <div class="fw-semibold text-muted small">
          <i class="bi bi-person-circle me-1"></i><span class="display-user-name">Candidate</span>
        </div>
      </div>

      <!-- Status Card -->
      <div class="status-card text-center" id="statusCardContainer">
        <div class="py-5">
          <div class="spinner-border text-primary" role="status"></div>
          <p class="mt-3 text-muted">Processing your application...</p>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app-data.js"></script>
  <script src="js/sidebar.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const user = CareerLinkDB.requireAuth('Candidate');
      if (!user) return;

      const urlParams = new URLSearchParams(window.location.search);
      const jobId = urlParams.get('jobid');

      const container = document.getElementById('statusCardContainer');

      if (!jobId) {
        window.location.href = 'search-jobs.html';
        return;
      }

      const job = CareerLinkDB.getJobById(jobId);
      const result = CareerLinkDB.applyForJob(jobId, user.user_id);

      if (result.success) {
        container.innerHTML = `
          <div class="card-icon icon-green mx-auto mb-3" style="width: 75px; height: 75px; font-size: 36px;">
            <i class="bi bi-check2-circle"></i>
          </div>
          <h3 class="fw-bold text-dark mb-2">Success!</h3>
          <p class="text-muted mb-1">${result.message}</p>
          ${job ? `<div class="p-3 bg-light rounded-3 my-3 border small"><b>Applied Role:</b> ${job.job_title} at <b>${job.company_name}</b></div>` : ''}
          <div class="d-grid gap-3 mt-4">
            <a href="search-jobs.html" class="btn btn-primary rounded-pill py-2 fw-bold">Browse More Jobs</a>
            <a href="my-applications.html" class="btn btn-light border rounded-pill py-2 fw-bold text-dark">View My Applications</a>
          </div>
        `;
      } else {
        container.innerHTML = `
          <div class="card-icon icon-yellow mx-auto mb-3" style="width: 75px; height: 75px; font-size: 36px;">
            <i class="bi bi-exclamation-triangle-fill"></i>
          </div>
          <h3 class="fw-bold text-dark mb-2">Notice</h3>
          <p class="text-muted mb-1">${result.message}</p>
          ${job ? `<div class="p-3 bg-light rounded-3 my-3 border small"><b>Target Role:</b> ${job.job_title} at <b>${job.company_name}</b></div>` : ''}
          <div class="d-grid gap-3 mt-4">
            ${result.isDuplicate 
              ? `<a href="my-applications.html" class="btn btn-primary rounded-pill py-2 fw-bold">View Application Status</a>` 
              : `<a href="candidate-profile.html" class="btn btn-warning rounded-pill py-2 fw-bold text-dark">Complete Profile & Resume</a>`}
            <a href="search-jobs.html" class="btn btn-light border rounded-pill py-2 fw-bold text-dark">Return to Job Search</a>
          </div>
        `;
      }
    });
  </script>
</body>
</html>
