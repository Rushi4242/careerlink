<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Skill Matches | Candidate</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

  <div class="wrapper">
    <!-- Dynamic Sidebar -->
    <nav class="sidebar" id="sidebarNav"></nav>

    <!-- Main Content Area -->
    <div class="content">
      <!-- Top Navbar -->
      <div class="top-navbar">
        <div class="d-flex align-items-center gap-3">
          <button class="mobile-nav-toggle" id="mobileNavToggle"><i class="bi bi-list"></i></button>
          <h5 class="m-0 fw-bold text-dark"><i class="bi bi-stars text-warning me-2"></i>AI Skill Recommendations</h5>
        </div>
        <div class="fw-semibold text-muted small">
          <i class="bi bi-person-circle me-1"></i><span class="display-user-name">Candidate</span>
        </div>
      </div>

      <!-- Skills Notice Banner -->
      <div id="skillsBannerContainer" class="mb-4"></div>

      <!-- Recommendations Grid -->
      <div class="row g-4" id="recommendedGrid">
        <!-- Rendered dynamically -->
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app-data.js"></script>
  <script src="js/sidebar.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const user = CareerLinkDB.requireAuth('Candidate');
      if (!user) return;

      const bannerContainer = document.getElementById('skillsBannerContainer');
      const gridContainer = document.getElementById('recommendedGrid');

      if (!user.skills || user.skills.trim().length === 0) {
        bannerContainer.innerHTML = `
          <div class="alert alert-warning p-4 rounded-3 shadow-sm">
            <h5 class="fw-bold"><i class="bi bi-info-circle-fill me-2"></i>No Skills Listed</h5>
            <p class="mb-3">Please update your profile with your technical skills (e.g. Java, Python, React, SQL) to receive personalized AI recommendations.</p>
            <a href="candidate-profile.html" class="btn btn-warning rounded-pill fw-bold px-4">Update Skills</a>
          </div>
        `;
        return;
      }

      bannerContainer.innerHTML = `
        <div class="alert alert-success border-0 shadow-sm d-flex align-items-center rounded-3 mb-4 p-3">
          <i class="bi bi-magic fs-3 me-3 text-success"></i>
          <div>Showing positions matching your skills: <b class="text-dark">${user.skills}</b></div>
        </div>
      `;

      const matches = CareerLinkDB.getRecommendedJobs(user.user_id);

      if (matches.length === 0) {
        gridContainer.innerHTML = `
          <div class="col-12 text-center py-5">
            <i class="bi bi-emoji-frown text-muted" style="font-size: 50px;"></i>
            <h5 class="mt-3 text-muted">No direct matches found for your primary skills at the moment.</h5>
            <a href="search-jobs.html" class="btn btn-outline-primary mt-2 rounded-pill px-4 fw-bold">Browse All Jobs</a>
          </div>
        `;
        return;
      }

      gridContainer.innerHTML = matches.map(job => {
        return `
          <div class="col-md-6 col-lg-4">
            <div class="job-card">
              <div class="d-flex justify-content-between align-items-start mb-2">
                <div>
                  <h5 class="text-primary fw-bold mb-1">${job.job_title}</h5>
                  <div class="text-muted fw-semibold"><i class="bi bi-building me-1"></i>${job.company_name}</div>
                </div>
                <span class="badge bg-success shadow-sm rounded-pill px-3 py-2">${job.matchScore}% Match</span>
              </div>
              <div class="d-flex gap-3 text-muted small my-2">
                <span><i class="bi bi-geo-alt-fill text-danger me-1"></i>${job.location}</span>
                <span><i class="bi bi-cash-stack text-success me-1"></i>${job.salary}</span>
              </div>
              <div class="border-top pt-2 mt-2 mb-3">
                <span class="d-block mb-1 text-dark small"><b>Req. Exp:</b> ${job.experience}</span>
                <p class="text-muted small mb-0">${job.description ? job.description.substring(0, 110) + '...' : ''}</p>
              </div>
              <a href="apply-job.html?jobid=${job.job_id}" class="btn btn-primary w-100 rounded-pill fw-bold mt-auto py-2">Apply Match</a>
            </div>
          </div>
        `;
      }).join('');
    });
  </script>
</body>
</html>
