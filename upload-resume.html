<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Upload Resume | Candidate</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

  <div class="wrapper">
    <!-- Dynamic Sidebar -->
    <nav class="sidebar" id="sidebarNav"></nav>

    <!-- Main Content Area -->
    <div class="content">
      <!-- Top Navbar -->
      <div class="top-navbar">
        <div class="d-flex align-items-center gap-3">
          <button class="mobile-nav-toggle" id="mobileNavToggle"><i class="bi bi-list"></i></button>
          <h5 class="m-0 fw-bold text-dark"><i class="bi bi-file-earmark-arrow-up text-primary me-2"></i>Upload Document</h5>
        </div>
        <div class="fw-semibold text-muted small">
          <i class="bi bi-person-circle me-1"></i><span class="display-user-name">Candidate</span>
        </div>
      </div>

      <!-- Resume Upload Card -->
      <div class="form-card">
        <div id="alertBox" style="display: none;" class="alert p-3 rounded-3 mb-3"></div>

        <!-- Active Resume Banner Container -->
        <div id="activeResumeContainer" class="mb-4"></div>

        <!-- File Upload Form -->
        <form id="resumeForm">
          <div class="mb-3">
            <label id="fileInputLabel" class="form-label fw-bold text-muted small">Select Document (PDF or Word)</label>
            <input type="file" id="resumeFileInput" class="form-control" accept=".pdf,.doc,.docx" required>
            <div class="form-text text-muted small">Accepted formats: .pdf, .doc, .docx (Max 10MB)</div>
          </div>

          <button type="submit" id="uploadBtn" class="btn btn-primary w-100 py-2 fw-bold rounded-pill shadow-sm">Upload Resume</button>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app-data.js"></script>
  <script src="js/sidebar.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const user = CareerLinkDB.requireAuth('Candidate');
      if (!user) return;

      function renderResumeStatus() {
        const resume = CareerLinkDB.getResume(user.user_id);
        const container = document.getElementById('activeResumeContainer');
        const fileLabel = document.getElementById('fileInputLabel');
        const uploadBtn = document.getElementById('uploadBtn');

        if (resume && resume.resume_file) {
          container.innerHTML = `
            <div class="alert border mb-4" style="background-color: #f0f9ff; border-color: #bfdbfe;">
              <div class="d-flex justify-content-between align-items-center mb-2">
                <h6 class="text-primary fw-bold m-0"><i class="bi bi-file-earmark-check-fill me-2"></i>Current Active Resume</h6>
                <span class="badge bg-success rounded-pill px-3 py-2"><i class="bi bi-check-circle-fill me-1"></i> Uploaded</span>
              </div>
              <p class="mb-1 text-dark fw-bold">${resume.resume_file}</p>
              <small class="text-muted d-block mb-0">Uploaded On: ${resume.upload_date} | Uploading a new file below will safely overwrite this existing document.</small>
            </div>
          `;
          fileLabel.textContent = "Select New Document to Replace Current Resume";
          uploadBtn.textContent = "Update Resume";
        } else {
          container.innerHTML = `
            <div class="alert alert-warning mb-4">
              <i class="bi bi-exclamation-triangle-fill me-2"></i>You have not uploaded a resume yet. You must upload one to apply for jobs.
            </div>
          `;
          fileLabel.textContent = "Select Document (PDF or Word)";
          uploadBtn.textContent = "Upload Resume";
        }
      }

      renderResumeStatus();

      document.getElementById('resumeForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const alertBox = document.getElementById('alertBox');
        const fileInput = document.getElementById('resumeFileInput');

        if (!fileInput.files || fileInput.files.length === 0) {
          alertBox.className = 'alert alert-warning p-3 rounded-3 mb-3';
          alertBox.textContent = "Please select a file to upload.";
          alertBox.style.display = 'block';
          return;
        }

        const fileName = fileInput.files[0].name;
        const res = CareerLinkDB.saveResume(user.user_id, fileName);

        if (res.success) {
          alertBox.className = 'alert alert-success p-3 rounded-3 mb-3 fw-bold';
          alertBox.innerHTML = `<i class="bi bi-check-circle-fill me-2"></i>Resume Updated Successfully! Saved as: ${fileName}`;
          alertBox.style.display = 'block';
          renderResumeStatus();
          document.getElementById('resumeForm').reset();
        }
      });
    });
  </script>
</body>
</html>
