<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Post Job | HR Portal</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

  <div class="wrapper">
    <!-- Dynamic Sidebar -->
    <nav class="sidebar" id="sidebarNav"></nav>

    <!-- Main Content Area -->
    <div class="content">
      <!-- Top Navbar -->
      <div class="top-navbar">
        <div class="d-flex align-items-center gap-3">
          <button class="mobile-nav-toggle" id="mobileNavToggle"><i class="bi bi-list"></i></button>
          <h5 class="m-0 fw-bold text-dark"><i class="bi bi-plus-circle text-primary me-2"></i>Create Job Posting</h5>
        </div>
        <div class="fw-semibold text-muted small">
          <i class="bi bi-person-circle me-1"></i><span class="display-user-name">HR Manager</span>
        </div>
      </div>

      <!-- Job Post Form Card -->
      <div class="form-card" style="max-width: 800px;">
        <div id="alertBox" style="display: none;" class="alert p-3 rounded-3 mb-3"></div>

        <form id="postJobForm">
          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label fw-bold text-muted small">Job Title</label>
              <input type="text" id="jobTitle" class="form-control" placeholder="e.g. Senior Java Developer" required>
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label fw-bold text-muted small">Company Name</label>
              <input type="text" id="jobCompany" class="form-control" placeholder="e.g. TCS / Tech Solutions" required>
            </div>
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label fw-bold text-muted small">Job Location</label>
              <input type="text" id="jobLocation" class="form-control" placeholder="e.g. Pune, Hybrid / Remote" required>
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label fw-bold text-muted small">Salary Package</label>
              <input type="text" id="jobSalary" class="form-control" placeholder="e.g. ₹8.5 LPA" required>
            </div>
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label fw-bold text-muted small">Required Experience</label>
              <input type="text" id="jobExp" class="form-control" placeholder="e.g. 1-2 Years or Fresher" required>
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label fw-bold text-muted small">Application Deadline</label>
              <input type="date" id="jobLastDate" class="form-control" required>
            </div>
          </div>

          <div class="mb-4">
            <label class="form-label fw-bold text-muted small">Comprehensive Job Description</label>
            <textarea id="jobDesc" class="form-control" rows="5" placeholder="Detail responsibilities, required skills, technical stack, and perks..." required></textarea>
          </div>

          <button type="submit" id="submitBtn" class="btn btn-primary w-100 py-2 fw-bold rounded-pill shadow-sm">Submit Listing (Send for Admin Approval)</button>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app-data.js"></script>
  <script src="js/sidebar.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const user = CareerLinkDB.requireAuth('HR');
      if (!user) return;

      // Set default deadline date (30 days ahead)
      const defaultDate = new Date();
      defaultDate.setDate(defaultDate.getDate() + 30);
      document.getElementById('jobLastDate').value = defaultDate.toISOString().split('T')[0];

      document.getElementById('postJobForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const alertBox = document.getElementById('alertBox');

        const title = document.getElementById('jobTitle').value;
        const company = document.getElementById('jobCompany').value;
        const location = document.getElementById('jobLocation').value;
        const salary = document.getElementById('jobSalary').value;
        const experience = document.getElementById('jobExp').value;
        const last_date = document.getElementById('jobLastDate').value;
        const description = document.getElementById('jobDesc').value;

        const res = CareerLinkDB.createJob({
          title,
          company,
          location,
          salary,
          experience,
          description,
          last_date,
          hrId: user.user_id
        });

        if (res.success) {
          alertBox.className = 'alert alert-success p-3 rounded-3 mb-3 fw-bold';
          alertBox.innerHTML = `<i class="bi bi-check-circle-fill me-2"></i>${res.message} <a href="hr-manage-jobs.html" class="alert-link fw-bold ms-2">View in Manage Jobs</a>`;
          alertBox.style.display = 'block';
          document.getElementById('postJobForm').reset();
        }
      });
    });
  </script>
</body>
</html>
