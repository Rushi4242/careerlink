<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Applications | Candidate</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

  <div class="wrapper">
    <!-- Dynamic Sidebar -->
    <nav class="sidebar" id="sidebarNav"></nav>

    <!-- Main Content Area -->
    <div class="content">
      <!-- Top Navbar -->
      <div class="top-navbar">
        <div class="d-flex align-items-center gap-3">
          <button class="mobile-nav-toggle" id="mobileNavToggle"><i class="bi bi-list"></i></button>
          <h5 class="m-0 fw-bold text-dark"><i class="bi bi-card-list text-primary me-2"></i>My Job Applications</h5>
        </div>
        <div class="fw-semibold text-muted small">
          <i class="bi bi-person-circle me-1"></i><span class="display-user-name">Candidate</span>
        </div>
      </div>

      <!-- Data Card -->
      <div class="data-card">
        <div class="table-responsive">
          <table class="table table-hover align-middle border">
            <thead>
              <tr>
                <th>Job Title</th>
                <th>Company & Location</th>
                <th>Applied On</th>
                <th>Application Status</th>
              </tr>
            </thead>
            <tbody id="applicationsTableBody">
              <!-- Rendered dynamically -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app-data.js"></script>
  <script src="js/sidebar.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const user = CareerLinkDB.requireAuth('Candidate');
      if (!user) return;

      const apps = CareerLinkDB.getCandidateApplications(user.user_id);
      const tbody = document.getElementById('applicationsTableBody');

      if (apps.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="4" class="text-center text-muted py-5">
              <i class="bi bi-folder-x fs-1 d-block mb-2 opacity-50"></i>
              You have not applied for any jobs yet. Head over to <a href="search-jobs.html" class="fw-bold">Search Jobs</a> to get started!
            </td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = apps.map(app => {
        let badgeHtml = '';
        if (app.status === 'Pending') {
          badgeHtml = '<span class="badge bg-warning text-dark px-3 py-2 rounded-pill"><i class="bi bi-hourglass-split me-1"></i>Pending Review</span>';
        } else if (app.status === 'Rejected') {
          badgeHtml = '<span class="badge bg-danger px-3 py-2 rounded-pill"><i class="bi bi-x-circle me-1"></i>Rejected</span>';
        } else if (app.status === 'Shortlisted' || app.status === 'Accepted') {
          badgeHtml = '<span class="badge bg-success px-3 py-2 rounded-pill"><i class="bi bi-check-circle me-1"></i>Shortlisted</span>';
        }

        return `
          <tr>
            <td><span class="text-primary fw-bold">${app.job_title}</span></td>
            <td>
              <span class="fw-bold d-block text-dark"><i class="bi bi-building me-2 text-muted"></i>${app.company_name}</span>
              <small class="text-muted"><i class="bi bi-geo-alt me-1"></i>${app.location}</small>
            </td>
            <td><i class="bi bi-calendar-date me-1 text-muted"></i><b>${app.apply_date}</b></td>
            <td>${badgeHtml}</td>
          </tr>
        `;
      }).join('');
    });
  </script>
</body>
</html>
