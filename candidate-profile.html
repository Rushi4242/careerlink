<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Profile | Candidate</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

  <div class="wrapper">
    <!-- Dynamic Sidebar -->
    <nav class="sidebar" id="sidebarNav"></nav>

    <!-- Main Content Area -->
    <div class="content">
      <!-- Top Navbar -->
      <div class="top-navbar">
        <div class="d-flex align-items-center gap-3">
          <button class="mobile-nav-toggle" id="mobileNavToggle"><i class="bi bi-list"></i></button>
          <h5 class="m-0 fw-bold text-dark">Account Settings</h5>
        </div>
        <div class="fw-semibold text-muted small">
          <i class="bi bi-person-circle me-1"></i><span class="display-user-name">Candidate</span>
        </div>
      </div>

      <!-- Profile Form Card -->
      <div class="profile-card">
        <div class="text-center mb-4">
          <div class="bg-primary text-white rounded-circle d-flex align-items-center justify-content-center mx-auto mb-3" style="width: 75px; height: 75px; font-size: 32px;">
            <i class="bi bi-person"></i>
          </div>
          <h4 class="fw-bold">My Profile</h4>
          <p class="text-muted small">Update your technical skills, experience, and education to unlock job applications.</p>
        </div>

        <div id="alertBox" style="display: none;" class="alert p-3 rounded-3 mb-3"></div>

        <form id="profileForm">
          <div class="row">
            <!-- Full Name -->
            <div class="col-md-6 mb-3">
              <label class="form-label fw-bold text-muted small">Full Name</label>
              <input type="text" id="profFullName" name="fullname" class="form-control" required>
            </div>
            <!-- Mobile Number -->
            <div class="col-md-6 mb-3">
              <label class="form-label fw-bold text-muted small">Mobile Number</label>
              <input type="tel" id="profMobile" name="mobile" class="form-control" pattern="[0-9]{10}" maxlength="10" required>
            </div>
          </div>

          <!-- Email Address (Read Only) -->
          <div class="mb-3">
            <label class="form-label fw-bold text-muted small">Email Address (Read Only)</label>
            <input type="email" id="profEmail" class="form-control text-muted" readonly style="background: #e9ecef;">
          </div>

          <!-- Highest Education -->
          <div class="mb-3">
            <label class="form-label fw-bold text-muted small">Highest Education</label>
            <input type="text" id="profEdu" name="education" class="form-control" placeholder="e.g. B.Tech in Computer Science" required>
          </div>

          <!-- Technical Skills -->
          <div class="mb-3">
            <label class="form-label fw-bold text-muted small">Technical Skills (Comma separated)</label>
            <input type="text" id="profSkills" name="skills" class="form-control" placeholder="e.g. Java, Python, SQL, React" required>
          </div>

          <!-- Professional Experience -->
          <div class="mb-4">
            <label class="form-label fw-bold text-muted small">Professional Experience</label>
            <select id="profExp" name="experience" class="form-select" required>
              <option value="" disabled>Select Experience Level</option>
              <option value="Fresher">Fresher</option>
              <option value="1-2 Years">1-2 Years</option>
              <option value="3-5 Years">3-5 Years</option>
              <option value="5+ Years">5+ Years</option>
            </select>
          </div>

          <button type="submit" id="submitBtn" class="btn btn-primary w-100 py-2 fw-bold rounded-pill shadow-sm">Save Profile Updates</button>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app-data.js"></script>
  <script src="js/sidebar.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const user = CareerLinkDB.requireAuth('Candidate');
      if (!user) return;

      document.getElementById('profFullName').value = user.full_name || '';
      document.getElementById('profMobile').value = user.mobile || '';
      document.getElementById('profEmail').value = user.email || '';
      document.getElementById('profEdu').value = user.education || '';
      document.getElementById('profSkills').value = user.skills || '';
      document.getElementById('profExp').value = user.experience || 'Fresher';

      document.getElementById('profileForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const alertBox = document.getElementById('alertBox');
        const fullname = document.getElementById('profFullName').value;
        const mobile = document.getElementById('profMobile').value;
        const education = document.getElementById('profEdu').value;
        const skills = document.getElementById('profSkills').value;
        const experience = document.getElementById('profExp').value;

        const res = CareerLinkDB.updateCandidateProfile(user.user_id, {
          fullname,
          mobile,
          education,
          skills,
          experience
        });

        if (res.success) {
          alertBox.className = 'alert alert-success p-3 rounded-3 mb-3 fw-bold';
          alertBox.innerHTML = `<i class="bi bi-check-circle-fill me-2"></i>Profile Updated Successfully!`;
          alertBox.style.display = 'block';

          // Update header display name immediately
          document.querySelectorAll('.display-user-name').forEach(el => el.textContent = fullname);
        } else {
          alertBox.className = 'alert alert-danger p-3 rounded-3 mb-3 fw-bold';
          alertBox.innerHTML = `<i class="bi bi-exclamation-triangle-fill me-2"></i>${res.message}`;
          alertBox.style.display = 'block';
        }
      });
    });
  </script>
</body>
</html>
