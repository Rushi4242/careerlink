<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manage Jobs | HR Portal</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

  <div class="wrapper">
    <!-- Dynamic Sidebar -->
    <nav class="sidebar" id="sidebarNav"></nav>

    <!-- Main Content Area -->
    <div class="content">
      <!-- Top Navbar -->
      <div class="top-navbar">
        <div class="d-flex align-items-center gap-3">
          <button class="mobile-nav-toggle" id="mobileNavToggle"><i class="bi bi-list"></i></button>
          <h5 class="m-0 fw-bold text-dark"><i class="bi bi-gear-fill text-primary me-2"></i>Manage Job Postings</h5>
        </div>
        <div class="d-flex align-items-center gap-3">
          <a href="post-job.html" class="btn btn-sm btn-primary rounded-pill px-3 fw-bold"><i class="bi bi-plus-lg me-1"></i>New Job</a>
          <div class="fw-semibold text-muted small">
            <i class="bi bi-person-circle me-1"></i><span class="display-user-name">HR Manager</span>
          </div>
        </div>
      </div>

      <!-- Data Card -->
      <div class="data-card">
        <div id="alertBox" style="display: none;" class="alert p-3 rounded-3 mb-3"></div>

        <div class="table-responsive">
          <table class="table table-hover align-middle border">
            <thead>
              <tr>
                <th>Job Title & Location</th>
                <th>Salary & Experience</th>
                <th>Posted Date</th>
                <th>Deadline</th>
                <th>Admin Approval</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="jobsTableBody">
              <!-- Dynamically populated -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app-data.js"></script>
  <script src="js/sidebar.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const user = CareerLinkDB.requireAuth('HR');
      if (!user) return;

      function renderJobsTable() {
        const jobs = CareerLinkDB.getJobsByHR(user.user_id);
        const tbody = document.getElementById('jobsTableBody');

        if (jobs.length === 0) {
          tbody.innerHTML = `
            <tr>
              <td colspan="6" class="text-center text-muted py-5">
                <i class="bi bi-inbox fs-1 d-block mb-2 opacity-50"></i>
                No jobs posted yet. <a href="post-job.html" class="fw-bold">Post your first job here</a>!
              </td>
            </tr>
          `;
          return;
        }

        tbody.innerHTML = jobs.map(job => {
          let statusBadge = '';
          if (job.approval_status === 'Pending') {
            statusBadge = '<span class="badge bg-warning text-dark rounded-pill px-3 py-2"><i class="bi bi-hourglass-split me-1"></i>Pending</span>';
          } else if (job.approval_status === 'Approved') {
            statusBadge = '<span class="badge bg-success rounded-pill px-3 py-2"><i class="bi bi-check-circle me-1"></i>Approved</span>';
          } else if (job.approval_status === 'Rejected') {
            statusBadge = '<span class="badge bg-danger rounded-pill px-3 py-2"><i class="bi bi-x-circle me-1"></i>Rejected</span>';
          }

          return `
            <tr>
              <td>
                <b class="text-dark d-block">${job.job_title}</b>
                <small class="text-muted"><i class="bi bi-building me-1"></i>${job.company_name} | <i class="bi bi-geo-alt me-1"></i>${job.location}</small>
              </td>
              <td>
                <span class="text-success fw-bold">${job.salary}</span><br>
                <small class="text-muted">Req: ${job.experience}</small>
              </td>
              <td><i class="bi bi-calendar-event me-1 text-muted"></i>${job.posted_date}</td>
              <td><i class="bi bi-calendar-x me-1 text-muted"></i>${job.last_date || 'Open'}</td>
              <td>${statusBadge}</td>
              <td>
                <div class="d-flex gap-2">
                  <a href="hr-edit-job.html?jobid=${job.job_id}" class="btn btn-sm btn-outline-primary rounded-pill px-3 fw-bold">
                    <i class="bi bi-pencil-square me-1"></i>Edit
                  </a>
                  <button onclick="handleDeleteJob(${job.job_id})" class="btn btn-sm btn-outline-danger rounded-pill px-3 fw-bold">
                    <i class="bi bi-trash3-fill me-1"></i>Delete
                  </button>
                </div>
              </td>
            </tr>
          `;
        }).join('');
      }

      window.handleDeleteJob = function(jobId) {
        if (confirm("Are you sure you want to permanently delete this job and all associated candidate applications?")) {
          const res = CareerLinkDB.deleteJob(jobId, user.user_id);
          const alertBox = document.getElementById('alertBox');
          if (res.success) {
            alertBox.className = 'alert alert-success p-3 rounded-3 mb-3 fw-bold';
            alertBox.innerHTML = `<i class="bi bi-check-circle-fill me-2"></i>${res.message}`;
            alertBox.style.display = 'block';
            renderJobsTable();
          }
        }
      };

      renderJobsTable();
    });
  </script>
</body>
</html>
