<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Applications | HR Portal</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

  <div class="wrapper">
    <!-- Dynamic Sidebar -->
    <nav class="sidebar" id="sidebarNav"></nav>

    <!-- Main Content Area -->
    <div class="content">
      <!-- Top Navbar -->
      <div class="top-navbar">
        <div class="d-flex align-items-center gap-3">
          <button class="mobile-nav-toggle" id="mobileNavToggle"><i class="bi bi-list"></i></button>
          <h5 class="m-0 fw-bold text-dark"><i class="bi bi-file-earmark-person-fill text-primary me-2"></i>Candidate Applications</h5>
        </div>
        <div class="fw-semibold text-muted small">
          <i class="bi bi-person-circle me-1"></i><span class="display-user-name">HR Manager</span>
        </div>
      </div>

      <!-- Data Card -->
      <div class="data-card">
        <div class="table-responsive">
          <table class="table table-hover align-middle border">
            <thead>
              <tr>
                <th>Candidate Name</th>
                <th>Applied Role</th>
                <th>Candidate Skills & Experience</th>
                <th>Applied On</th>
                <th>Status</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="hrAppsTableBody">
              <!-- Dynamically populated -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app-data.js"></script>
  <script src="js/sidebar.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const user = CareerLinkDB.requireAuth('HR');
      if (!user) return;

      const apps = CareerLinkDB.getHRApplications(user.user_id);
      const tbody = document.getElementById('hrAppsTableBody');

      if (apps.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="6" class="text-center text-muted py-5">
              <i class="bi bi-inbox fs-1 d-block mb-2 opacity-50"></i>
              No applications received for your posted jobs yet.
            </td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = apps.map(app => {
        let statusBadge = '';
        if (app.status === 'Pending') {
          statusBadge = '<span class="badge bg-warning text-dark rounded-pill px-3 py-2"><i class="bi bi-hourglass-split me-1"></i>Pending</span>';
        } else if (app.status === 'Shortlisted' || app.status === 'Accepted') {
          statusBadge = '<span class="badge bg-success rounded-pill px-3 py-2"><i class="bi bi-check-circle me-1"></i>Shortlisted</span>';
        } else if (app.status === 'Rejected') {
          statusBadge = '<span class="badge bg-danger rounded-pill px-3 py-2"><i class="bi bi-x-circle me-1"></i>Rejected</span>';
        }

        return `
          <tr>
            <td><b class="text-dark">${app.candidate_name}</b></td>
            <td><span class="text-primary fw-bold">${app.job_title}</span></td>
            <td>
              <small class="d-block text-muted"><b>Exp:</b> ${app.experience}</small>
              <small class="d-block text-muted"><b>Skills:</b> ${app.skills}</small>
            </td>
            <td><i class="bi bi-calendar-event me-1 text-muted"></i>${app.apply_date}</td>
            <td>${statusBadge}</td>
            <td>
              <a href="hr-review-application.html?appid=${app.application_id}" class="btn btn-sm btn-outline-primary fw-bold rounded-pill px-3">
                <i class="bi bi-eye-fill me-1"></i>Review
              </a>
            </td>
          </tr>
        `;
      }).join('');
    });
  </script>
</body>
</html>
