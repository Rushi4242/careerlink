<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign In | Career Link</title>
  <meta name="description" content="Sign in to your Career Link account as a Candidate, HR Manager, or Administrator.">
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="auth-page">

  <div class="container py-4">
    <div class="login-card">
      <!-- Left Brand Panel -->
      <div class="brand-side d-none d-md-flex">
        <h1 class="fw-bold mb-3"><i class="bi bi-layers-fill me-2"></i>Career Link</h1>
        <p class="fs-5 opacity-90">Your bridge to the best professional career opportunities and top-tier corporate talent.</p>
        <div class="mt-4 pt-4 border-top border-white border-opacity-25">
          <small class="opacity-75 d-block mb-2"><i class="bi bi-shield-check me-2"></i>Secure SHA-256 Authentication</small>
          <small class="opacity-75 d-block"><i class="bi bi-lightning-charge-fill me-2"></i>Instant Vercel Cloud Deployment</small>
        </div>
      </div>

      <!-- Right Form Panel -->
      <div class="form-side">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <h3 class="fw-bold text-dark mb-0">Welcome Back</h3>
          <a href="index.html" class="text-decoration-none text-muted small"><i class="bi bi-house me-1"></i>Home</a>
        </div>

        <!-- Alert Banner -->
        <div id="alertBox" style="display: none;" class="alert alert-danger p-3 rounded-3 mb-3"></div>

        <!-- Quick Demo Login Pills (for easy testing) -->
        <div class="mb-4 p-3 bg-light rounded-3 border">
          <label class="form-label text-muted fw-bold mb-2 small"><i class="bi bi-magic me-1"></i>Quick Demo Login (1-Click Fill):</label>
          <div class="d-flex flex-wrap gap-2">
            <button type="button" class="btn btn-sm btn-outline-primary rounded-pill px-3 fw-bold" onclick="quickFill('Candidate', 'candidate@careerlink.com', 'candidate@123')">
              <i class="bi bi-person me-1"></i>Candidate
            </button>
            <button type="button" class="btn btn-sm btn-outline-success rounded-pill px-3 fw-bold" onclick="quickFill('HR', 'hr@tcs.com', 'hr@123')">
              <i class="bi bi-buildings me-1"></i>HR Manager
            </button>
            <button type="button" class="btn btn-sm btn-outline-dark rounded-pill px-3 fw-bold" onclick="quickFill('Admin', 'admin@careerlink.com', 'admin@123')">
              <i class="bi bi-shield-lock me-1"></i>Admin
            </button>
          </div>
        </div>

        <form id="loginForm">
          <!-- Role Selection Dropdown -->
          <div class="mb-3">
            <label class="form-label text-muted fw-bold small">Login As</label>
            <select id="roleSelect" name="role" class="form-select" required>
              <option value="" disabled selected>-- Select your role --</option>
              <option value="Candidate">Candidate</option>
              <option value="HR">HR Manager</option>
              <option value="Admin">System Administrator</option>
            </select>
          </div>

          <!-- Email Address Input -->
          <div class="mb-3">
            <label class="form-label text-muted fw-bold small">Email Address</label>
            <input type="email" id="emailInput" name="email" class="form-control" placeholder="name@example.com" required>
          </div>

          <!-- Password Input -->
          <div class="mb-2">
            <label class="form-label text-muted fw-bold small">Password</label>
            <input type="password" id="passwordInput" name="password" class="form-control" placeholder="Enter your password" required>
          </div>

          <!-- Forgot Password Link -->
          <div class="text-start mb-4">
            <a href="forgot-password.html" class="text-decoration-none fw-bold text-primary small">Forgot Password?</a>
          </div>

          <!-- Submit Button -->
          <button type="submit" id="submitBtn" class="btn btn-primary w-100 py-2 fw-bold rounded-pill mb-3">Sign In</button>
        </form>

        <div class="text-center mt-3 border-top pt-3">
          <p class="text-muted mb-0 small">Don't have an account? <a href="register.html" class="text-decoration-none fw-bold text-primary">Register Here</a></p>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app-data.js"></script>
  <script>
    function quickFill(role, email, pass) {
      document.getElementById('roleSelect').value = role;
      document.getElementById('emailInput').value = email;
      document.getElementById('passwordInput').value = pass;
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alertBox = document.getElementById('alertBox');
      const submitBtn = document.getElementById('submitBtn');
      const role = document.getElementById('roleSelect').value;
      const email = document.getElementById('emailInput').value;
      const password = document.getElementById('passwordInput').value;

      submitBtn.disabled = true;
      submitBtn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span>Authenticating...`;
      alertBox.style.display = 'none';

      const result = await CareerLinkDB.login(email, password, role);

      if (result.success) {
        if (role === 'Candidate') window.location.href = 'candidate-dashboard.html';
        else if (role === 'HR') window.location.href = 'hr-dashboard.html';
        else if (role === 'Admin') window.location.href = 'admin-dashboard.html';
      } else {
        submitBtn.disabled = false;
        submitBtn.innerHTML = `Sign In`;
        alertBox.innerHTML = `<i class="bi bi-exclamation-circle-fill me-2"></i>${result.message}`;
        alertBox.style.display = 'block';
      }
    });
  </script>
</body>
</html>
