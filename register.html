<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register | Career Link</title>
  <meta name="description" content="Create a new Candidate or HR employer account on Career Link.">
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="auth-page">

  <div class="container py-4">
    <div class="login-card">
      <!-- Left Brand Panel -->
      <div class="brand-side d-none d-md-flex">
        <h1 class="fw-bold mb-3"><i class="bi bi-layers-fill me-2"></i>Career Link</h1>
        <p class="fs-5 opacity-90">Join thousands of professionals finding their next big opportunity today.</p>
        <div class="mt-4 pt-4 border-top border-white border-opacity-25">
          <p class="small opacity-75 mb-2"><i class="bi bi-check-circle-fill me-2 text-warning"></i>Verified Employer Job Listings</p>
          <p class="small opacity-75 mb-2"><i class="bi bi-check-circle-fill me-2 text-warning"></i>AI Skill Recommendations</p>
          <p class="small opacity-75 mb-0"><i class="bi bi-check-circle-fill me-2 text-warning"></i>Direct Interview Scheduling</p>
        </div>
      </div>

      <!-- Right Form Panel -->
      <div class="form-side">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h3 class="fw-bold text-dark mb-0">Create Account</h3>
          <a href="index.html" class="text-decoration-none text-muted small"><i class="bi bi-house me-1"></i>Home</a>
        </div>

        <!-- Alert Banner -->
        <div id="alertBox" style="display: none;" class="alert p-3 rounded-3 mb-3"></div>

        <form id="registerForm">
          <div class="row g-3 mb-3">
            <!-- Role Selection -->
            <div class="col-md-12">
              <label class="form-label text-muted fw-bold small">Register As</label>
              <select id="regRole" name="role" class="form-select" required>
                <option value="" disabled selected>-- Select Account Type --</option>
                <option value="Candidate">Candidate (Looking for Jobs)</option>
                <option value="HR">HR Manager (Posting Jobs)</option>
              </select>
            </div>

            <!-- Full Name -->
            <div class="col-md-12">
              <label class="form-label text-muted fw-bold small">Full Name</label>
              <input type="text" id="regFullName" name="fullName" class="form-control" placeholder="e.g. Rahul Verma" required>
            </div>

            <!-- Mobile Number -->
            <div class="col-md-6">
              <label class="form-label text-muted fw-bold small">Mobile Number</label>
              <input type="tel" id="regMobile" name="mobile" class="form-control" placeholder="10-digit number" pattern="[0-9]{10}" maxlength="10" required>
            </div>

            <!-- Email Address -->
            <div class="col-md-6">
              <label class="form-label text-muted fw-bold small">Email Address</label>
              <input type="email" id="regEmail" name="email" class="form-control" placeholder="name@example.com" required>
            </div>

            <!-- Password with '@' validation -->
            <div class="col-md-12">
              <label class="form-label text-muted fw-bold small">Create Password</label>
              <input type="password" id="regPassword" name="password" class="form-control" placeholder="Must contain '@' (e.g. MyPass@123)" pattern=".*@.*" title="Password must contain an '@' special character" required>
              <div class="form-text small text-muted">Password must contain an '@' special character.</div>
            </div>
          </div>

          <!-- Submit Button -->
          <button type="submit" id="submitBtn" class="btn btn-primary w-100 py-2 fw-bold rounded-pill mb-3">Sign Up</button>
        </form>

        <div class="text-center mt-3 border-top pt-3">
          <p class="text-muted mb-0 small">Already have an account? <a href="login.html" class="text-decoration-none fw-bold text-primary">Sign In</a></p>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app-data.js"></script>
  <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alertBox = document.getElementById('alertBox');
      const submitBtn = document.getElementById('submitBtn');

      const role = document.getElementById('regRole').value;
      const fullName = document.getElementById('regFullName').value;
      const mobile = document.getElementById('regMobile').value;
      const email = document.getElementById('regEmail').value;
      const password = document.getElementById('regPassword').value;

      submitBtn.disabled = true;
      submitBtn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span>Creating Account...`;
      alertBox.style.display = 'none';

      const result = await CareerLinkDB.register({ fullName, email, mobile, role, password });

      submitBtn.disabled = false;
      submitBtn.innerHTML = `Sign Up`;

      if (result.success) {
        alertBox.className = 'alert alert-success p-3 rounded-3 mb-3 text-center';
        alertBox.innerHTML = `<i class="bi bi-check-circle-fill me-2"></i>${result.message} <a href="login.html" class="alert-link fw-bold ms-1">Sign In Here</a>`;
        alertBox.style.display = 'block';
        document.getElementById('registerForm').reset();
      } else {
        alertBox.className = 'alert alert-danger p-3 rounded-3 mb-3 text-center';
        alertBox.innerHTML = `<i class="bi bi-exclamation-circle-fill me-2"></i>${result.message}`;
        alertBox.style.display = 'block';
      }
    });
  </script>
</body>
</html>
