<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>All Interviews | Admin</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

  <div class="wrapper">
    <!-- Dynamic Sidebar -->
    <nav class="sidebar" id="sidebarNav"></nav>

    <!-- Main Content Area -->
    <div class="content">
      <!-- Top Navbar -->
      <div class="top-navbar">
        <div class="d-flex align-items-center gap-3">
          <button class="mobile-nav-toggle" id="mobileNavToggle"><i class="bi bi-list"></i></button>
          <h5 class="m-0 fw-bold text-dark"><i class="bi bi-calendar-event-fill text-danger me-2"></i>Platform Interviews</h5>
        </div>
        <div class="fw-semibold text-muted small">
          <i class="bi bi-shield-check text-success me-1"></i><span class="display-user-name">Admin</span>
        </div>
      </div>

      <!-- Data Card -->
      <div class="data-card">
        <div class="table-responsive">
          <table class="table table-hover align-middle border">
            <thead>
              <tr>
                <th>Candidate</th>
                <th>Company & Job Role</th>
                <th>Interview Date & Time</th>
                <th>Mode</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="allInterviewsTableBody">
              <!-- Dynamically populated -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app-data.js"></script>
  <script src="js/sidebar.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const user = CareerLinkDB.requireAuth('Admin');
      if (!user) return;

      const interviews = CareerLinkDB.getAllInterviews();
      const tbody = document.getElementById('allInterviewsTableBody');

      if (interviews.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="5" class="text-center text-muted py-5">
              <i class="bi bi-calendar-x fs-1 d-block mb-2 opacity-50"></i>
              No interviews scheduled across the platform yet.
            </td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = interviews.map(item => {
        let modeIcon = 'bi-laptop';
        if (item.interview_mode === 'Offline') modeIcon = 'bi-geo-alt';
        if (item.interview_mode === 'Phone Call') modeIcon = 'bi-telephone';

        return `
          <tr>
            <td><b class="text-dark">${item.candidate_name}</b></td>
            <td>
              <i class="bi bi-building me-1 text-muted"></i>${item.company_name}<br>
              <small class="text-primary fw-bold">${item.job_title}</small>
            </td>
            <td>
              <i class="bi bi-calendar-event me-1 text-muted"></i>${item.interview_date}<br>
              <small class="text-muted"><i class="bi bi-clock me-1"></i>${item.interview_time}</small>
            </td>
            <td><i class="bi ${modeIcon} me-1 text-muted"></i>${item.interview_mode}</td>
            <td><span class="badge bg-success rounded-pill px-3 py-2"><i class="bi bi-check-circle me-1"></i>${item.status}</span></td>
          </tr>
        `;
      }).join('');
    });
  </script>
</body>
</html>
